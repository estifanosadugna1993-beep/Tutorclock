<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so the layout reaches under the notch and
       the home bar; the CSS pads itself back with safe-area insets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TutorClock</title>
  <meta name="description" content="A trust-first time tracker for private tutors.">

  <!-- Colour of the phone's status bar when installed -->
  <meta name="theme-color" content="#6657df">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TutorClock">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/tutorclock.css">
</head>
<body>
  <!-- Every screen is rendered into here by js/app.js -->
  <main class="shell" id="app"></main>

  <noscript>
    <p style="padding:24px;text-align:center;color:#7d7c91">
      TutorClock needs JavaScript switched on to run.
    </p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
